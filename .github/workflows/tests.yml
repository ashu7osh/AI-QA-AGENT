
name: AI QA Agent Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-qa-agent .

      - name: Prepare artifact directories
        run: |
          mkdir -p screenshots traces videos logs allure-results reports

      - name: Run POM smoke tests in Docker
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/screenshots:/app/screenshots" \
            -v "$GITHUB_WORKSPACE/traces:/app/traces" \
            -v "$GITHUB_WORKSPACE/videos:/app/videos" \
            -v "$GITHUB_WORKSPACE/logs:/app/logs" \
            -v "$GITHUB_WORKSPACE/reports:/app/reports" \
            -v "$GITHUB_WORKSPACE/allure-results:/app/allure-results" \
            ai-qa-agent \
            pytest -m "smoke and pom" --alluredir=allure-results

      - name: Run AI-generated tests in Docker
        env:
          LLM_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          docker run --rm \
            -e LLM_PROVIDER \
            -e GROQ_API_KEY \
            -v "$GITHUB_WORKSPACE/screenshots:/app/screenshots" \
            -v "$GITHUB_WORKSPACE/traces:/app/traces" \
            -v "$GITHUB_WORKSPACE/videos:/app/videos" \
            -v "$GITHUB_WORKSPACE/logs:/app/logs" \
            -v "$GITHUB_WORKSPACE/reports:/app/reports" \
            -v "$GITHUB_WORKSPACE/allure-results:/app/allure-results" \
            ai-qa-agent \
            pytest -m ai_generated --alluredir=allure-results

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            screenshots/
            traces/
            videos/
            reports/
            logs/

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
