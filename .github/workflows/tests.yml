name: AI QA Agent Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger it manually from the GitHub UI

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      
      - name: Run hand-written POM smoke tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -m "smoke and pom" --alluredir=allure-results
  
      - name: Run AI-generated pipeline tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          LLM_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pytest -m ai_generated --alluredir=allure-results

      - name: Upload test artifacts (screenshots, traces, videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            screenshots/
            traces/
            videos/
            reports/
            logs/

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
